apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay. This is the directory Config Sync's RootSync reconciles
# (see deploy/rootsync.yaml). Fork the repo and edit the values below for your
# project; CI (cloudbuild.yaml) or a GitOps bot updates the image tags.

resources:
  - ../../base

# Point the workloads at your Artifact Registry images. Replace REGION and
# PROJECT_ID, and set newTag to the image tag you build (e.g. the commit SHA).
images:
  - name: gateway
    newName: us-central1-docker.pkg.dev/PROJECT_ID/golden-signals/gateway
    newTag: latest
  - name: orders
    newName: us-central1-docker.pkg.dev/PROJECT_ID/golden-signals/orders
    newTag: latest
  - name: fulfillment
    newName: us-central1-docker.pkg.dev/PROJECT_ID/golden-signals/fulfillment
    newTag: latest
