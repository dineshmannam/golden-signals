# Collector configuration for the DaemonSet below.
#
# This mirrors otel/collector-config.yaml (the canonical, standalone copy). Keep
# the two in sync; the standalone file is what the README documents, this one is
# what the cluster actually runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: golden-signals
data:
  collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      resourcedetection:
        detectors: [env, gcp]
        timeout: 5s
        override: false
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.node.name
      batch:
        send_batch_size: 200
        send_batch_max_size: 400
        timeout: 5s

    exporters:
      googlecloud:
        log:
          default_log_name: golden-signals
      googlemanagedprometheus: {}

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [googlecloud]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [googlemanagedprometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [googlecloud]
      telemetry:
        logs:
          encoding: json
