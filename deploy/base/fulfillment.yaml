# The asynchronous fulfillment worker. It has no inbound business traffic, so
# there is no Service — it pulls OrderCreated events from its Pub/Sub
# subscription. The http port exists only for the liveness/readiness probes and
# the Prometheus /metrics scrape (see podmonitoring.yaml).
#
# PROJECT_ID is a placeholder the operator replaces per-fork (same convention as
# serviceaccounts.yaml); see deploy/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillment
  namespace: golden-signals
  labels:
    app: fulfillment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fulfillment
  template:
    metadata:
      labels:
        app: fulfillment
    spec:
      serviceAccountName: fulfillment
      containers:
        - name: fulfillment
          # Overlays set the real Artifact Registry image and tag.
          image: fulfillment:latest
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            # DATABASE_URL comes from the same Secret orders uses (the worker
            # shares the orders table, marking rows fulfilled).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-db
                  key: url
            - name: PUBSUB_PROJECT_ID
              value: PROJECT_ID
            - name: PUBSUB_SUBSCRIPTION_ORDER_CREATED
              value: order-created-fulfillment
            - name: OTEL_SERVICE_NAME
              value: fulfillment
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: $(NODE_IP):4317
            - name: LOG_LEVEL
              value: info
            - name: FAULT_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
