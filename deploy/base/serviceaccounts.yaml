# Kubernetes service accounts, one per workload. Each is linked to a Google
# service account via the iam.gke.io/gcp-service-account annotation (Workload
# Identity). Terraform creates the matching GSAs and the IAM bindings; the GSA
# emails are emitted by `terraform output service_accounts`.
#
# PROJECT_ID is a placeholder: replace it with your project (the deploy/README
# shows a one-line sed) before Config Sync reconciles this repo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: golden-signals
  annotations:
    iam.gke.io/gcp-service-account: golden-signals-gateway@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders
  namespace: golden-signals
  annotations:
    iam.gke.io/gcp-service-account: golden-signals-orders@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: golden-signals
  annotations:
    iam.gke.io/gcp-service-account: golden-signals-collector@PROJECT_ID.iam.gserviceaccount.com
